[project]
name = "duke-energy-ha"
version = "0.1.0"
description = "Home Assistant custom integration that imports Duke Energy hourly usage into long-term statistics"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13.2"
# The integration itself has no runtime requirements beyond what Home Assistant
# ships (aiohttp, yarl, PyJWT). Everything below is development tooling.
dependencies = []

[dependency-groups]
dev = [
    # Latest supported HA (Python 3.14) and the minimum supported HA (2025.12,
    # Python 3.13). Which one you get depends on the interpreter uv uses.
    "pytest-homeassistant-custom-component==0.13.375; python_full_version >= '3.14.2'",
    "pytest-homeassistant-custom-component==0.13.301; python_full_version < '3.14.2'",
    "ruff>=0.14",
    "mypy>=1.18",
]

[tool.uv]
package = false
environments = [
    "python_full_version >= '3.14.2'",
    "python_full_version >= '3.13.2' and python_full_version < '3.14.2'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:aioresponses.*"]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "COM812", # conflicts with the formatter
    "ISC001", # conflicts with the formatter
    "TD002",
    "TD003",
    "FIX002",
    "PLR0913",
    "PLR0911",
    "PLR0912",
    "PLR2004", # magic values: HTTP status codes read better inline
    "C901",
    "ANN401",  # Any is the honest type for untrusted JSON
    "CPY001",
    "TC001",
    "TC002",
    "TC003",
    "EM101",
    "EM102",
    "TRY003",
    "ARG001",  # Home Assistant fixes callback signatures
    "ARG002",
    "ARG004",
    "S105",    # constant names like CONF_REFRESH_TOKEN trip this
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert
    "PLR2004", # magic values
    "SLF001",  # private access
    "D",       # docstrings
    "ANN",     # annotations
    "ARG001",  # unused fixture args
    "INP001",
    "FBT001",
    "FBT002",
    "FBT003",
    "PT004",
    "TID252",  # relative imports of test helpers
    "ARG005",
    "DTZ001",  # naive datetimes only used for .date()
    "PLC0415",
    "ISC004",
    "E501",
    "S106",
    "S311",
    "RUF005",
]
"scripts/**" = ["T201", "INP001", "S101", "D", "E501", "PTH", "ASYNC240", "FURB171"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "custom_components.duke_energy.api.*",
    "custom_components.duke_energy.statistics",
]
strict = true
