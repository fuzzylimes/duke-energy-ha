name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.14
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy custom_components
      - name: Versions agree
        run: |
          manifest=$(python3 -c "import json;print(json.load(open('custom_components/duke_energy/manifest.json'))['version'])")
          project=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$manifest" = "$project" || { echo "manifest $manifest != pyproject $project"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then test "v$manifest" = "${GITHUB_REF_NAME}"; fi
      - name: Shared User-Agent file is valid
        run: |
          uv run python -c "
          import json
          from custom_components.duke_energy.user_agent import valid_remote_user_agent
          value = json.load(open('user-agents.json'))['app_user_agent']
          assert valid_remote_user_agent(value), value
          "

  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 resolves the minimum supported Home Assistant (2025.12);
        # 3.14 resolves the latest one pinned in pyproject.toml.
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run pytest -q

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
